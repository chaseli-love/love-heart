<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
送给沈谷桐宝宝 ❤️
</title>


<style>


*{
margin:0;
padding:0;
}


body{

overflow:hidden;

background:black;

}



canvas{

position:absolute;

top:0;

left:0;

}




/* 开场 */

#intro{

position:fixed;

width:100%;

height:100%;

background:black;

z-index:100;


animation:
hideIntro 5s forwards;

}



.introText{

position:absolute;

top:50%;

left:50%;


transform:
translate(-50%,-50%);


color:white;


font-size:38px;


text-align:center;


text-shadow:

0 0 20px pink,
0 0 60px red;


}



.meteor{

position:absolute;


width:5px;

height:200px;


background:

linear-gradient(
white,
transparent
);


transform:

rotate(45deg);


top:-200px;

left:80%;


animation:

meteor 2s infinite;


}



@keyframes meteor{


0%{

top:-200px;

left:90%;

}


100%{

top:100%;

left:10%;

}


}




@keyframes hideIntro{


0%{

opacity:1;

}


80%{

opacity:1;

}


100%{

opacity:0;

visibility:hidden;

}


}





/* 中心文字 */


#loveText{


position:absolute;


top:50%;

left:50%;


transform:
translate(-50%,-50%);



color:white;


font-size:38px;


text-align:center;


z-index:20;


text-shadow:

0 0 20px pink,
0 0 50px red;


animation:pulse 2s infinite;


}



@keyframes pulse{


0%{

scale:1;

}


100%{

scale:1.1;

}


}





/*照片区域*/


#photos{

position:absolute;

width:100%;

height:100%;


z-index:10;


pointer-events:none;

}




.photo{


position:absolute;


object-fit:cover;


border-radius:18px;


box-shadow:

0 0 30px pink;


opacity:0;


animation:

floatPhoto 15s infinite;


}




@keyframes floatPhoto{


0%{

opacity:0;

transform:

scale(.7)
translateY(100px)
rotate(-15deg);


}


20%{

opacity:1;

}


50%{

opacity:1;


transform:

scale(1)
translateY(0)
rotate(0);


}


80%{

opacity:.8;


}


100%{

opacity:0;


transform:

scale(.7)
translateY(-100px)
rotate(15deg);


}


}






#btn{


position:absolute;


bottom:40px;


left:50%;


transform:

translateX(-50%);



padding:

12px 30px;


border:none;


border-radius:30px;


background:

rgba(255,0,120,.8);


color:white;


font-size:18px;


z-index:50;


}




#flash{


position:fixed;

width:100%;

height:100%;


background:white;


opacity:0;


z-index:200;


pointer-events:none;


}



</style>

</head>


<body>



<audio id="music" loop>

<source src="love.mp3">

</audio>



<div id="intro">


<div class="meteor"></div>


<div class="introText">


✨<br>

沈谷桐宝宝 ❤️


<br>


<small>

正在为你准备一份礼物

</small>


</div>


</div>





<div id="flash"></div>



<div id="loveText">

送给<br>

沈谷桐宝宝 ❤️

</div>



<div id="photos"></div>



<button id="btn">

点击播放音乐 🎵

</button>



<canvas id="canvas"></canvas>



<script>

  const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.onresize=resize;



// =================
// 星空
// =================

let stars=[];


for(let i=0;i<300;i++){

stars.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2+0.5

});

}




// =================
// 生成30张照片
// =================


let photoBox =
document.getElementById("photos");



for(let i=1;i<=30;i++){


let img =
document.createElement("img");


img.src =
i+".jpg";


img.className="photo";


// 避开中心爱心

let angle =
Math.random()*Math.PI*2;


let radius =
260+
Math.random()*200;



let x =
canvas.width/2+
Math.cos(angle)*radius;



let y =
canvas.height/2+
Math.sin(angle)*radius;



img.style.left=x+"px";

img.style.top=y+"px";



let size =
70+
Math.random()*50;


img.style.width=size+"px";

img.style.height=size*1.35+"px";



img.style.animationDelay =
Math.random()*15+"s";



photoBox.appendChild(img);


}






// =================
// 爱心粒子
// =================


let particles=[];


for(let i=0;i<1800;i++){



let t =
Math.random()*Math.PI*2;



let x =
16*Math.pow(Math.sin(t),3);



let y =
13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t);



particles.push({


x:
(Math.random()-0.5)
*canvas.width*2,


y:
(Math.random()-0.5)
*canvas.height*2,


z:
Math.random()*200-100,


targetX:x*12,


targetY:-y*12,


size:
Math.random()*2+1


});


}




let forming=true;


let formCount=0;


let rotate=0;



// =================
// 爆炸粒子
// =================

let boom=[];



canvas.onclick=function(e){


for(let i=0;i<100;i++){


boom.push({

x:e.clientX,

y:e.clientY,


vx:
(Math.random()-0.5)*10,


vy:
(Math.random()-0.5)*10,


life:80


});


}


};






// =================
// 绘制
// =================


function draw(){


ctx.fillStyle=
"rgba(0,0,20,0.35)";


ctx.fillRect(

0,
0,
canvas.width,
canvas.height

);




// 星空


stars.forEach(s=>{


ctx.beginPath();


ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
);


ctx.fillStyle="white";


ctx.fill();


});




// 星光汇聚


if(forming){


formCount++;


particles.forEach(p=>{


p.x +=
(p.targetX-p.x)
*
0.025;



p.y +=
(p.targetY-p.y)
*
0.025;



});



if(formCount>180){


forming=false;


}

}



// 爱心旋转


if(!forming){

rotate+=0.015;

}



let cx=
canvas.width/2;


let cy=
canvas.height/2;




particles.forEach(p=>{



let x =
p.x*Math.cos(rotate)
-
p.z*Math.sin(rotate);



let z =
p.x*Math.sin(rotate)
+
p.z*Math.cos(rotate);



let scale =
350/(350+z);



let px =
cx+x*scale;


let py =
cy+p.y*scale;



ctx.beginPath();


ctx.arc(

px,

py,

p.size*scale,

0,

Math.PI*2

);



ctx.fillStyle=

"rgb(255,100,180)";


ctx.shadowBlur=20;

ctx.shadowColor="pink";


ctx.fill();


});





// 爆炸


boom.forEach((p,i)=>{


p.x+=p.vx;

p.y+=p.vy;


p.life--;


ctx.beginPath();


ctx.arc(

p.x,

p.y,

4,

0,

Math.PI*2

);


ctx.fillStyle="pink";


ctx.fill();



if(p.life<=0){

boom.splice(i,1);

}


});





requestAnimationFrame(draw);


}


draw();







// =================
// 爱心形成闪光
// =================


setTimeout(()=>{


let f=
document.getElementById("flash");


f.style.transition="0.5s";

f.style.opacity="0.8";


setTimeout(()=>{

f.style.opacity="0";

},300);



},5000);








// =================
// 音乐
// =================


document
.getElementById("btn")
.onclick=function(){


document
.getElementById("music")
.play();


this.innerHTML=
"正在播放 ❤️";


};

  </script>

</body>

</html>
