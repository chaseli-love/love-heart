<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
送给沈谷桐宝宝 ❤️
</title>


<style>


html,body{

margin:0;
padding:0;

overflow:hidden;

background:black;

}


canvas{

display:block;

}



/* 开场 */

#intro{

position:fixed;

width:100%;
height:100%;

background:black;

z-index:999;

animation:
introHide 4s forwards;

}



.introText{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

color:white;

font-size:38px;

text-align:center;

font-family:
Microsoft YaHei;


text-shadow:

0 0 20px pink,
0 0 50px red;


animation:
textShow 3s;

}


.introText small{

font-size:18px;

}




.meteor{


position:absolute;

width:4px;

height:180px;


background:

linear-gradient(
white,
transparent
);


transform:
rotate(45deg);


top:-200px;

left:80%;


animation:

meteor 2s infinite;


}



@keyframes meteor{


0%{

top:-200px;

left:90%;

opacity:1;

}


100%{

top:100%;

left:20%;

opacity:0;

}


}



@keyframes textShow{


0%{

opacity:0;

}


50%{

opacity:1;

}


100%{

opacity:1;

}


}



@keyframes introHide{


0%{

opacity:1;

}


85%{

opacity:1;

}


100%{

opacity:0;

visibility:hidden;

}


}



/* 中间文字 */


#loveText{


position:absolute;


top:50%;

left:50%;


transform:
translate(-50%,-50%);


color:white;


font-size:38px;


text-align:center;


font-family:
Microsoft YaHei;


text-shadow:

0 0 15px pink,
0 0 40px red;


animation:

pulse 2s infinite;


z-index:5;


}




@keyframes pulse{


0%{

scale:1;

}


100%{

scale:1.1;

}


}




/* 音乐按钮 */


#btn{


position:absolute;


bottom:40px;


left:50%;


transform:
translateX(-50%);



padding:

12px 30px;



border:none;


border-radius:30px;


background:

rgba(255,0,120,.8);



color:white;


font-size:18px;


z-index:10;


}




</style>


</head>


<body>



<audio id="music" loop>

<source src="love.mp3" type="audio/mpeg">

</audio>




<!-- 开场 -->

<div id="intro">


<div class="meteor"></div>


<div class="introText">

✨<br>

沈谷桐宝宝 ❤️

<br>

<small>

正在为你准备一份礼物

</small>


</div>


</div>





<div id="loveText">

送给<br>

沈谷桐宝宝 ❤️


</div>



<button id="btn">

点击播放音乐 🎵

</button>




<canvas id="canvas"></canvas>



<script>



const canvas =
document.getElementById("canvas");


const ctx =
canvas.getContext("2d");



function resize(){


canvas.width =
innerWidth;


canvas.height =
innerHeight;


}


resize();


window.onresize=resize;






// 星空


let stars=[];


for(let i=0;i<250;i++){


stars.push({

x:
Math.random()*innerWidth,

y:
Math.random()*innerHeight,

r:
Math.random()*2

});


}





// 爱心粒子


let particles=[];


for(let i=0;i<2000;i++){


let t =
Math.random()*Math.PI*2;



let x =
16*Math.pow(Math.sin(t),3);


let y =
13*Math.cos(t)

-5*Math.cos(2*t)

-2*Math.cos(3*t)

-Math.cos(4*t);



particles.push({


x:x*10,

y:-y*10,

z:
Math.random()*100-50,


size:
Math.random()*2+1


});


}




let rotate=0;


let boom=[];




// 点击爆炸


canvas.onclick=function(e){


for(let i=0;i<100;i++){


boom.push({


x:e.clientX,

y:e.clientY,


vx:
(Math.random()-0.5)*10,


vy:
(Math.random()-0.5)*10,


life:100


});


}



};







function draw(){



ctx.fillStyle=

"rgba(0,0,20,.3)";


ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);




// 星星


stars.forEach(s=>{


ctx.beginPath();


ctx.arc(

s.x,

s.y,

s.r,

0,

Math.PI*2

);


ctx.fillStyle="white";


ctx.fill();



});







rotate+=0.015;



let cx =
canvas.width/2;


let cy =
canvas.height/2;





particles.forEach(p=>{



let x =

p.x*Math.cos(rotate)

-

p.z*Math.sin(rotate);



let z =

p.x*Math.sin(rotate)

+

p.z*Math.cos(rotate);



let scale=

400/(400+z);



let px=

cx+x*scale;



let py=

cy+p.y*scale;



ctx.beginPath();


ctx.arc(

px,

py,

p.size*scale,

0,

Math.PI*2

);



ctx.fillStyle=

"rgb(255,80,160)";



ctx.shadowBlur=20;

ctx.shadowColor="red";


ctx.fill();



});







// 爆炸


boom.forEach((p,i)=>{


p.x+=p.vx;

p.y+=p.vy;


p.life--;



ctx.beginPath();


ctx.arc(

p.x,

p.y,

4,

0,

Math.PI*2

);


ctx.fillStyle="pink";


ctx.fill();



if(p.life<=0)

boom.splice(i,1);


});






requestAnimationFrame(draw);



}


draw();






// 音乐


document.getElementById("btn")

.onclick=function(){


document.getElementById("music")

.play();



this.innerHTML=

"正在播放 ❤️";


};



</script>



</body>

</html>
