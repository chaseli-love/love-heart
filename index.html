<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
送给沈谷桐宝宝 ❤️
</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

width:100%;

height:100%;

overflow:hidden;

background:black;

font-family:"Microsoft YaHei";

}



canvas{

position:absolute;

top:0;

left:0;

width:100%;

height:100%;

}



/* =================
开场
================= */


#intro{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;


background:black;


z-index:100;


animation:
introHide 5s forwards;


}



.introText{


position:absolute;


top:50%;


left:50%;


transform:
translate(-50%,-50%);


text-align:center;


color:white;


font-size:38px;


line-height:1.6;


text-shadow:

0 0 20px pink,

0 0 60px red;


}



.introText small{


font-size:18px;


}



.meteor{


position:absolute;


width:4px;


height:180px;


background:

linear-gradient(
white,
transparent
);



transform:

rotate(45deg);



top:-200px;


left:80%;



animation:

meteorMove 2s infinite;


}



@keyframes meteorMove{


0%{

top:-200px;

left:90%;

opacity:1;

}



100%{

top:100%;

left:10%;

opacity:0;

}


}





@keyframes introHide{


0%{

opacity:1;

}



85%{

opacity:1;

}



100%{

opacity:0;

visibility:hidden;

}


}







/* =================
中心文字
================= */


#loveText{


position:absolute;


top:50%;


left:50%;


transform:

translate(-50%,-50%);



z-index:20;


color:white;


font-size:38px;


text-align:center;



text-shadow:


0 0 20px pink,


0 0 50px red;



animation:

heartText 2s infinite alternate;


}



@keyframes heartText{


from{

scale:1;

}



to{

scale:1.08;

}


}







/* =================
照片区域
================= */


#photos{


position:absolute;


top:0;


left:0;


width:100%;


height:100%;



z-index:10;


pointer-events:none;


}





.photo{


position:absolute;



object-fit:cover;



border-radius:18px;



border:3px solid rgba(255,255,255,.6);



box-shadow:


0 0 25px pink,

0 0 50px rgba(255,0,120,.5);



opacity:0;



transition:


opacity 2s ease,

transform 5s ease;



}




/* =================
播放按钮
================= */


#btn{


position:absolute;


left:50%;


bottom:35px;



transform:

translateX(-50%);



z-index:50;



padding:

12px 30px;



border:none;



border-radius:30px;



background:

rgba(255,0,120,.8);



color:white;



font-size:18px;



box-shadow:

0 0 20px pink;


}





/* 闪光 */

#flash{


position:fixed;


top:0;


left:0;


width:100%;


height:100%;



background:white;



opacity:0;



z-index:200;



pointer-events:none;


}



</style>

</head>



<body>



<audio id="music" loop>


<source src="love.mp3" type="audio/mpeg">


</audio>



<!-- 开场 -->


<div id="intro">


<div class="meteor"></div>



<div class="introText">


✨<br>


沈谷桐宝宝 ❤️


<br>


<small>

正在为你准备一份礼物

</small>



</div>



</div>




<div id="flash"></div>





<!-- 中心文字 -->


<div id="loveText">


送给<br>


沈谷桐宝宝 ❤️


</div>




<!-- 照片容器 -->


<div id="photos"></div>





<button id="btn">


点击播放音乐 🎵


</button>




<canvas id="canvas"></canvas>





<script>

  // =====================
// 初始化画布
// =====================


const canvas =
document.getElementById("canvas");


const ctx =
canvas.getContext("2d");



function resize(){


canvas.width =
window.innerWidth;


canvas.height =
window.innerHeight;


}



resize();


window.addEventListener(
"resize",
resize
);





// =====================
// 星空
// =====================


let stars=[];



for(let i=0;i<250;i++){


stars.push({


x:
Math.random()*canvas.width,


y:
Math.random()*canvas.height,


r:
Math.random()*2+0.5


});


}







// =====================
// 爱心粒子
// =====================


let particles=[];



for(let i=0;i<1500;i++){



let t =
Math.random()*Math.PI*2;



let x =
16*Math.pow(Math.sin(t),3);



let y =
13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t);



particles.push({


x:
(Math.random()-0.5)
*
canvas.width*1.5,


y:
(Math.random()-0.5)
*
canvas.height*1.5,


z:
Math.random()*200-100,


targetX:x*10,


targetY:-y*10,


size:
Math.random()*2+1


});


}




let forming=true;


let formTime=0;


let rotate=0;





// =====================
// 照片系统
// =====================


let photoBox =
document.getElementById("photos");



let photos=[];



for(let i=1;i<=30;i++){


let img =
document.createElement("img");


img.src =
i+".jpg";


img.className="photo";



let size;



if(window.innerWidth<600){


size =
55+
Math.random()*25;


}

else{


size =
80+
Math.random()*40;


}



img.style.width=size+"px";


img.style.height=
size*1.35+"px";



photoBox.appendChild(img);



photos.push(img);


}






let photoIndex=0;




// 显示4张照片


function showPhotos(){



// 全部隐藏

photos.forEach(p=>{


p.style.opacity=0;


});




let count=4;



for(let i=0;i<count;i++){



if(photoIndex>=30){

photoIndex=0;

}



let img =
photos[photoIndex];



photoIndex++;





// 手机适配范围


let w =
canvas.width;


let h =
canvas.height;



let positions=[



{

x:w*0.15,

y:h*0.25

},



{

x:w*0.65,

y:h*0.25

},



{

x:w*0.12,

y:h*0.65

},



{

x:w*0.68,

y:h*0.65

}


];



let pos =
positions[i];



img.style.left =
pos.x+"px";


img.style.top =
pos.y+"px";




img.style.transform=

`
rotate(
${Math.random()*20-10}deg
)
scale(1)
`;



img.style.opacity=1;


}




// 停留5秒


setTimeout(()=>{


for(let i=0;i<count;i++){


photos[
(photoIndex-count+i+30)%30
]
.style.opacity=0;


}


},5000);


}





// 每6秒换一组


showPhotos();


setInterval(

showPhotos,

6500

);








// =====================
// 爱心爆炸
// =====================


let boom=[];




canvas.addEventListener(
"click",
function(e){



for(let i=0;i<100;i++){


boom.push({


x:e.clientX,


y:e.clientY,



vx:
(Math.random()-0.5)*10,


vy:
(Math.random()-0.5)*10,


life:80



});


}



});






// =====================
// 绘制动画
// =====================



function draw(){



ctx.fillStyle=

"rgba(0,0,20,0.35)";


ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);






// 星空


stars.forEach(s=>{



ctx.beginPath();



ctx.arc(

s.x,

s.y,

s.r,

0,

Math.PI*2

);



ctx.fillStyle="white";


ctx.fill();


});






// 爱心形成


if(forming){


formTime++;



particles.forEach(p=>{


p.x +=

(p.targetX-p.x)
*
0.02;



p.y +=

(p.targetY-p.y)
*
0.02;



});



if(formTime>200){


forming=false;


}



}






if(!forming){


rotate+=0.015;


}





let cx=
canvas.width/2;


let cy=
canvas.height/2;






particles.forEach(p=>{



let x =

p.x*Math.cos(rotate)

-

p.z*Math.sin(rotate);



let z =

p.x*Math.sin(rotate)

+

p.z*Math.cos(rotate);




let scale=

350/(350+z);




let px=

cx+x*scale;



let py=

cy+p.y*scale;




ctx.beginPath();



ctx.arc(

px,

py,

p.size*scale,

0,

Math.PI*2

);




ctx.fillStyle=

"rgb(255,80,160)";



ctx.shadowBlur=20;


ctx.shadowColor="pink";


ctx.fill();



});





// 爆炸粒子


boom.forEach((p,index)=>{


p.x+=p.vx;


p.y+=p.vy;


p.life--;



ctx.beginPath();


ctx.arc(

p.x,

p.y,

4,

0,

Math.PI*2

);



ctx.fillStyle="pink";


ctx.fill();



if(p.life<=0){


boom.splice(index,1);


}



});





requestAnimationFrame(draw);


}




draw();

  // =====================
// 爱心形成瞬间闪光
// =====================


setTimeout(()=>{


let flash =
document.getElementById("flash");



flash.style.transition =
"opacity 0.5s";


flash.style.opacity =
"0.8";



setTimeout(()=>{


flash.style.opacity="0";


},300);



},5200);







// =====================
// 音乐播放
// =====================


const music =
document.getElementById("music");


const btn =
document.getElementById("btn");



btn.onclick=function(){



music.play()
.then(()=>{


btn.innerHTML=
"正在播放 ❤️";


})
.catch(()=>{


alert(
"请再次点击播放音乐"
);


});



};
</script>


</body>

</html>
