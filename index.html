<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
送给沈谷桐宝宝 ❤️
</title>


<style>

html,body{

margin:0;
padding:0;

overflow:hidden;

background:black;

}


canvas{

display:block;

}


/* 开场 */

#intro{

position:fixed;

width:100%;
height:100%;

background:black;

z-index:999;

animation:
introOut 5s forwards;

}



.introText{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);


color:white;

font-size:38px;

text-align:center;


text-shadow:

0 0 20px pink,
0 0 50px red;


animation:textIn 3s;

}



.introText small{

font-size:18px;

}



.meteor{

position:absolute;

width:5px;

height:180px;


background:
linear-gradient(
white,
transparent
);


transform:
rotate(45deg);


top:-200px;

left:80%;


animation:
meteorMove 2s infinite;

}



@keyframes meteorMove{


0%{

top:-200px;

left:90%;

}


100%{

top:100%;

left:20%;

}

}



@keyframes textIn{


0%{

opacity:0;

}


100%{

opacity:1;

}

}



@keyframes introOut{


0%{

opacity:1;

}


85%{

opacity:1;

}


100%{

opacity:0;

visibility:hidden;

}

}




#loveText{


position:absolute;


top:50%;

left:50%;


transform:
translate(-50%,-50%);



color:white;


font-size:38px;


text-align:center;


z-index:5;


font-family:
Microsoft YaHei;


text-shadow:

0 0 20px pink,
0 0 50px red;


animation:pulse 2s infinite;


}




@keyframes pulse{


from{

scale:1;

}


to{

scale:1.1;

}


}



#flash{


position:fixed;

width:100%;

height:100%;

background:white;

opacity:0;

z-index:20;

pointer-events:none;

}





#btn{


position:absolute;


bottom:40px;


left:50%;


transform:
translateX(-50%);



padding:

12px 30px;



border:none;


border-radius:30px;


background:

rgba(255,0,120,.8);



color:white;


font-size:18px;


z-index:30;


}



</style>

</head>



<body>



<audio id="music" loop>

<source src="love.mp3" type="audio/mpeg">

</audio>



<div id="intro">

<div class="meteor"></div>


<div class="introText">

✨<br>

沈谷桐宝宝 ❤️

<br>

<small>

正在为你准备一份礼物

</small>


</div>


</div>



<div id="flash"></div>



<div id="loveText">

送给<br>

沈谷桐宝宝 ❤️


</div>



<button id="btn">

点击播放音乐 🎵

</button>



<canvas id="canvas"></canvas>



<script>



const canvas=
document.getElementById("canvas");


const ctx=
canvas.getContext("2d");



function resize(){

canvas.width=
innerWidth;

canvas.height=
innerHeight;

}


resize();


window.onresize=resize;





// 星空


let stars=[];


for(let i=0;i<300;i++){


stars.push({

x:
Math.random()*innerWidth,


y:
Math.random()*innerHeight,


r:
Math.random()*2+0.5


});


}






// 爱心粒子


let particles=[];



for(let i=0;i<2500;i++){



let t=
Math.random()*Math.PI*2;



let x=
16*Math.pow(Math.sin(t),3);



let y=
13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t);



let targetX=x*10;

let targetY=-y*10;



particles.push({



x:
(Math.random()-0.5)
*canvas.width*2,


y:
(Math.random()-0.5)
*canvas.height*2,


z:
Math.random()*300-150,



targetX,

targetY,


size:
Math.random()*2+1


});


}






let progress=0;


let rotate=0;


let formed=false;



let explosion=[];





// 点击爆炸


canvas.onclick=function(e){


for(let i=0;i<120;i++){


explosion.push({


x:e.clientX,

y:e.clientY,


vx:
(Math.random()-0.5)*12,


vy:
(Math.random()-0.5)*12,


life:100


});


}


};








function draw(){



ctx.fillStyle=
"rgba(0,0,20,0.3)";


ctx.fillRect(

0,
0,
canvas.width,
canvas.height

);





// 星空


stars.forEach(s=>{


ctx.beginPath();


ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
);


ctx.fillStyle="white";


ctx.fill();


});






// 聚集动画


if(progress<1){


progress+=0.004;


}



else{


formed=true;


}




if(formed){


rotate+=0.015;


}






let cx=
canvas.width/2;


let cy=
canvas.height/2;






particles.forEach(p=>{


// 星光飞向爱心


if(!formed){


p.x+=
(p.targetX-p.x)
*0.015;


p.y+=
(p.targetY-p.y)
*0.015;


}





let x=
p.x*Math.cos(rotate)
-
p.z*Math.sin(rotate);



let z=
p.x*Math.sin(rotate)
+
p.z*Math.cos(rotate);




let scale=
400/(400+z);



let px=
cx+x*scale;


let py=
cy+p.y*scale;




ctx.beginPath();


ctx.arc(

px,

py,

p.size*scale,

0,

Math.PI*2

);



let light=
180+
Math.sin(Date.now()/200+p.x)
*70;



ctx.fillStyle=
`rgb(255,${light},220)`;


ctx.shadowBlur=25;

ctx.shadowColor="pink";


ctx.fill();



});








// 爆炸


explosion.forEach((p,i)=>{


p.x+=p.vx;

p.y+=p.vy;


p.life--;


ctx.beginPath();


ctx.arc(
p.x,
p.y,
4,
0,
Math.PI*2
);


ctx.fillStyle="pink";


ctx.fill();



if(p.life<=0)

explosion.splice(i,1);



});






requestAnimationFrame(draw);



}


draw();






// 形成瞬间闪光


setTimeout(()=>{


let f=
document.getElementById("flash");


f.style.transition="1s";


f.style.opacity="0.8";


setTimeout(()=>{

f.style.opacity="0";

},300);


},5000);








// 音乐


document.getElementById("btn")

.onclick=function(){


document.getElementById("music")

.play();



this.innerHTML=

"正在播放 ❤️";


};



</script>


</body>


</html>
